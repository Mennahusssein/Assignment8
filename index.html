<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's For Dinner</title>

    <link rel="stylesheet" href="./CSS/all.min.css">
    <link rel="stylesheet" href="./CSS/bootstrap.min.css">
    <link rel="stylesheet" href="./CSS/style.css">


</head>

<body>

    <nav class="navbar-custom">
        <div class="container-fluid max-w-1200 px-3 px-md-4">
            <div class="d-flex align-items-center justify-content-around">
                <div class="d-flex align-items-center gap-3">
                    <div class="logo-badge">
                        <i class="fa-solid fa-utensils"></i>
                    </div>
                    <div>
                        <h1 class="h5 fw-bold mb-0 text-dark lh-1">What's For Dinner</h1>
                        <span class="text-muted small fw-normal" style="font-size: 0.8rem;">Your daily meal
                            inspiration</span>
                    </div>
                </div>

                <div class="d-flex align-items-center gap-1 gap-md-2">
                    <button class="nav-icon-btn" id="navBookmarkBtn" title="Saved Recipes" data-bs-toggle="offcanvas"
                        data-bs-target="#savedCanvas">
                        <i class="fa fa-bookmark"></i>
                        <span id="savedBadgeCount"
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                            style="display:none; font-size: 0.65rem;">0</span>
                    </button>
                    <button class="nav-icon-btn" id="navHistoryBtn" title="Recipe History" data-bs-toggle="offcanvas"
                        data-bs-target="#historyCanvas">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </button>
                    <button class="nav-icon-btn" title="Settings" id="settingsBtn">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                    <div class="ms-1 ms-md-2">
                        <img src="./images/personAvatar.jpg" alt="user avatar" class="avatar-img">
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-4 my-md-5 max-w-1200 px-3 px-md-4">
        <div class="recipe-card" id="recipeCard">
            <div class="row g-0">
                <div class="col-lg-5 image-col">
                    <img id="recipeImg" src="./images/shrimp.avif" alt="shrimp" class="image-bg">

                    <div class="rating-badge">
                        <i class="fa-solid fa-star rating-star"></i>
                        <span id="ratingVal" class="fw-bold text-dark">4.8</span>
                        <span id="reviewCount" class="text-muted" style="font-size: 0.82rem;">(356 reviews)</span>
                    </div>

                    <div class="specs-overlay">
                        <div class="spec-item">
                            <div class="spec-icon icon-prep">
                                <i class="fa-regular fa-clock"></i>
                            </div>
                            <span class="spec-label">Prep Time</span>
                            <span id="prepTime" class="spec-value">10 min</span>
                        </div>
                        <div class="spec-item">
                            <div class="spec-icon icon-cook">
                                <i class="fa-solid fa-fire-burner"></i>
                            </div>
                            <span class="spec-label">Cook Time</span>
                            <span id="cookTime" class="spec-value">15 min</span>
                        </div>
                        <div class="spec-item">
                            <div class="spec-icon icon-servings">
                                <i class="fa-solid fa-user-group"></i>
                            </div>
                            <span class="spec-label">Servings</span>
                            <span id="servingsVal" class="spec-value">2 people</span>
                        </div>
                    </div>
                </div>

                <div class="col-lg-7 details-col">
                    <div>
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <div class="d-flex align-items-center gap-2">
                                <span id="difficultyBadge" class="badge-easy">Easy</span>
                                <span id="categoryBadge" class="badge-category">Seafood</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <button class="action-btn-pill" id="cardBookmarkBtn" title="Bookmark Recipe">
                                    <i class="fa fa-bookmark"></i>
                                </button>
                                <button class="action-btn-pill" id="shareBtn" title="Share Recipe">
                                    <i class="fa-solid fa-share-nodes"></i>
                                </button>
                            </div>
                        </div>

                        <h2 id="recipeTitle" class="recipe-title">Shrimp Scampi</h2>
                        <p id="recipeSubtitle" class="recipe-subtitle">Garlicky shrimp in white wine butter sauce</p>

                        <div class="custom-tabs-nav">
                            <button class="nav-tab-item active" data-tab="ingredients">
                                <i class="fa-solid fa-list-ul"></i> Ingredients
                            </button>
                            <button class="nav-tab-item" data-tab="instructions">
                                <i class="fa-solid fa-book-open"></i> Instructions
                            </button>
                            <button class="nav-tab-item" data-tab="nutrition">
                                <i class="fa-solid fa-chart-pie"></i> Nutrition
                            </button>
                            <button class="nav-tab-item" data-tab="tips">
                                <i class="fa-regular fa-lightbulb"></i> Chef's Tips
                            </button>
                        </div>

                        <div class="tab-content-container" id="tabContentBox">
                        </div>

                    </div>

                    <div>
                        <button class="btn-try-another" id="tryAnotherBtn">
                            <i class="fa-solid fa-rotate"></i>
                            <span>Try Another Recipe</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>







    <script src="./JS/main.js"></script>
</body>

</html>
